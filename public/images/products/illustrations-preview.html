<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamburg — product illustrations</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF9F6;color:#10222A;font-family:"Archivo",sans-serif;padding:56px 5vw}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
p.sub{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4A6470;margin:0 0 46px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#DDD8CD;border:1px solid #DDD8CD}
.cell{background:#fff;padding:26px 20px 22px;text-align:center}
.cell img{width:100%;max-width:190px;height:auto;display:block;margin:0 auto 14px}
.name{font-size:15px;font-weight:600}
.file{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#4A6470;margin-top:5px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<h1>Product illustrations</h1>
<p class="sub">8 SVG marks · amber line art · scalable, no photo licensing</p>
<div class="grid">
<div class="cell"><img src="product-illustrations/base-oil.svg" alt="Steel drum"><div class="name">Base oil</div><div class="file">base-oil.svg</div></div>
<div class="cell"><img src="product-illustrations/bitumen.svg" alt="Pouring bitumen drum"><div class="name">Bitumen</div><div class="file">bitumen.svg</div></div>
<div class="cell"><img src="product-illustrations/fuel-oil.svg" alt="Jerrycan"><div class="name">Fuel oil</div><div class="file">fuel-oil.svg</div></div>
<div class="cell"><img src="product-illustrations/gas-oil.svg" alt="Fuel dispenser"><div class="name">Gas oil</div><div class="file">gas-oil.svg</div></div>
<div class="cell"><img src="product-illustrations/grease.svg" alt="Grease cartridge"><div class="name">Grease</div><div class="file">grease.svg</div></div>
<div class="cell"><img src="product-illustrations/hydrocarbon-oil.svg" alt="IBC tote"><div class="name">Hydrocarbon oil</div><div class="file">hydrocarbon-oil.svg</div></div>
<div class="cell"><img src="product-illustrations/naphtha.svg" alt="Laboratory flask"><div class="name">Naphtha</div><div class="file">naphtha.svg</div></div>
<div class="cell"><img src="product-illustrations/rubber-process-oil.svg" alt="Tyre"><div class="name">Rubber process oil</div><div class="file">rubber-process-oil.svg</div></div>
</div>
</body></html>
