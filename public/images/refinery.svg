<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Schematic of a crude oil distillation column showing product cuts by boiling range" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="tw" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#FBE3BC"/><stop offset="1" stop-color="#FDF4E4"/></linearGradient>
</defs>
<g font-family="Archivo, Helvetica, Arial, sans-serif">

<!-- furnace -->
<g fill="#FDF4E4" stroke="#E5901C" stroke-width="2.2" stroke-linejoin="round">
<rect x="42" y="286" width="104" height="96"/>
<path d="M58 286v-26h20v26M104 286v-26h20v26"/>
</g>
<text x="94" y="404" text-anchor="middle" font-size="12" fill="#56676F" letter-spacing="1.5">FURNACE</text>

<!-- crude feed -->
<g fill="none" stroke="#E5901C" stroke-width="4">
<path d="M146 334h74"/>
</g>
<path d="M220 328l16 6-16 6z" fill="#E5901C"/>
<text x="182" y="320" text-anchor="middle" font-size="12" fill="#56676F" letter-spacing="1.5">CRUDE</text>

<!-- column -->
<g stroke="#E5901C" stroke-width="2.4" stroke-linejoin="round">
<path d="M244 96a48 34 0 0 1 96 0v290H244z" fill="url(#tw)"/>
</g>
<g stroke="#E5901C" stroke-width="1.2" opacity=".7">
<path d="M256 132h72M256 174h72M256 216h72M256 258h72M256 300h72M256 342h72"/>
</g>
<text x="292" y="412" text-anchor="middle" font-size="12" fill="#56676F" letter-spacing="1.5">DISTILLATION COLUMN</text>

<!-- draw-off lines + labels -->
<g stroke-width="3" fill="none">
<path d="M340 118h150" stroke="#7FB7DA"/>
<path d="M340 176h150" stroke="#14618E"/>
<path d="M340 234h150" stroke="#5E8C2A"/>
<path d="M340 292h150" stroke="#E5901C"/>
<path d="M340 356h150" stroke="#D9531E"/>
</g>
<g font-size="15" fill="#0F1E26">
<text x="504" y="123">Naphtha</text>
<text x="504" y="181">Gas oil</text>
<text x="504" y="239">Base oil</text>
<text x="504" y="297">Fuel oil</text>
<text x="504" y="361">Bitumen</text>
</g>
<g font-size="12" fill="#56676F" font-family="IBM Plex Mono, monospace">
<text x="700" y="123">30–200 °C</text>
<text x="700" y="181">200–350 °C</text>
<text x="700" y="239">290–560 °C</text>
<text x="700" y="297">residue</text>
<text x="700" y="361">residue</text>
</g>
<g fill="#7FB7DA"><circle cx="492" cy="118" r="5"/></g>
<g fill="#14618E"><circle cx="492" cy="176" r="5"/></g>
<g fill="#5E8C2A"><circle cx="492" cy="234" r="5"/></g>
<g fill="#E5901C"><circle cx="492" cy="292" r="5"/></g>
<g fill="#D9531E"><circle cx="492" cy="356" r="5"/></g>

<!-- axis -->
<g stroke="#E3E6E8" stroke-width="1"><path d="M470 96v286"/></g>
<text x="862" y="60" text-anchor="end" font-size="11" fill="#56676F" font-family="IBM Plex Mono, monospace" letter-spacing="1.4">LIGHTEST AT TOP</text>
</g>
</svg>
